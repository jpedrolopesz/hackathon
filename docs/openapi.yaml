openapi: 3.1.0
info:
  title: Plataforma de Aulas ao Vivo — API v1
  description: |
    Contrato da API pública sob `/api/v1/*` (seção 13 do README — preparado para o
    app iOS; o painel web usa Server Actions internas para as mesmas operações, sem
    passar por este contrato — ver docs/fase-1-arquitetura.md, seção 15).

    **Autenticação:** `Authorization: Bearer {access_token}` do Cognito em toda
    chamada (ver docs/ios-integration.md para o fluxo completo). O API Gateway
    valida o JWT ANTES de chegar à Lambda (JWT authorizer escopado só a
    `/api/v1/*` — nunca nas páginas do painel); a rota também revalida
    internamente (defesa em profundidade).

    **Envelope de resposta**, sempre o mesmo formato:
    - Sucesso: `{ "data": <T>, "meta": { "requestId": string } }`
    - Erro: `{ "error": { "code": string, "message": string, "details": [], "requestId": string } }`

    `code` é ESTÁVEL entre versões — construa a UI reagindo a ele, nunca a
    `message` (que é só para exibição, em português).
  version: '1.0'
servers:
  - url: https://{appDomain}/api/v1
    variables:
      appDomain:
        default: exemplo.cloudfront.net
        description: Domínio da distribuição CloudFront unificada do ambiente.
security:
  - bearerAuth: []
paths:
  /me:
    get:
      summary: Obter o perfil autenticado
      responses: { '200': { $ref: '#/components/responses/Success' } }
    patch:
      summary: Atualizar nome/e-mail do perfil autenticado
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /courses:
    get:
      summary: Listar cursos acessíveis
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/Paginated' } }
    post:
      summary: Criar curso
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /courses/{courseId}:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    get:
      summary: Obter curso
      responses: { '200': { $ref: '#/components/responses/Success' } }
    patch:
      summary: Atualizar curso
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /classes:
    get:
      summary: Listar turmas acessíveis
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/Paginated' } }
    post:
      summary: Criar turma
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /classes/{classId}:
    parameters: [{ $ref: '#/components/parameters/ClassId' }]
    get:
      summary: Obter turma
      responses: { '200': { $ref: '#/components/responses/Success' } }
    patch:
      summary: Atualizar turma
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /classes/{classId}/lives:
    parameters: [{ $ref: '#/components/parameters/ClassId' }]
    get:
      summary: Listar aulas da turma
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/Paginated' } }
    post:
      summary: Agendar aula
      description: Aceita `scheduledDurationMinutes`; default 120 minutos.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /lives:
    get:
      summary: Listar aulas acessíveis
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/Paginated' } }
  /lives/{liveId}:
    parameters: [{ $ref: '#/components/parameters/liveId' }]
    get:
      summary: Obter aula
      responses: { '200': { $ref: '#/components/responses/Success' } }
    patch:
      summary: Atualizar aula
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /lives/{liveId}/start:
    post:
      summary: Iniciar aula
      parameters: [{ $ref: '#/components/parameters/liveId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /lives/{liveId}/finish:
    post:
      summary: Encerrar aula
      parameters: [{ $ref: '#/components/parameters/liveId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /lives/{liveId}/cancel:
    post:
      summary: Cancelar aula
      parameters: [{ $ref: '#/components/parameters/liveId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /lives/{liveId}/leave:
    post:
      summary: Sair da aula
      parameters: [{ $ref: '#/components/parameters/liveId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /lives/{liveId}/participants:
    get:
      summary: Listar participantes
      parameters: [{ $ref: '#/components/parameters/liveId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/Paginated' } }
  /lives/{liveId}/presenters/{userId}/promote:
    post:
      summary: Promover participante
      parameters: [{ $ref: '#/components/parameters/liveId' }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /lives/{liveId}/presenters/{userId}/demote:
    post:
      summary: Rebaixar apresentador
      parameters: [{ $ref: '#/components/parameters/liveId' }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /lives/{liveId}/participants/{userId}:
    delete:
      summary: Remover participante
      parameters: [{ $ref: '#/components/parameters/liveId' }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /lives/{liveId}/recordings/start:
    post:
      summary: Solicitar gravação
      description: A composição inicia quando houver publisher; pode retornar `PENDING_PUBLISHER`.
      parameters: [{ $ref: '#/components/parameters/liveId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /lives/{liveId}/recordings/stop:
    post:
      summary: Interromper composição ativa
      parameters: [{ $ref: '#/components/parameters/liveId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /lives/{liveId}/recordings:
    get:
      summary: Listar gravações da aula
      parameters: [{ $ref: '#/components/parameters/liveId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/Paginated' } }
  /recordings/{recordingId}:
    parameters: [{ $ref: '#/components/parameters/RecordingId' }]
    get:
      summary: Obter gravação
      responses: { '200': { $ref: '#/components/responses/Success' } }
    patch:
      summary: Alterar visibilidade (`PUBLISHED` ou `HIDDEN`)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /recordings/{recordingId}/publish:
    post:
      summary: Publicar replay
      parameters: [{ $ref: '#/components/parameters/RecordingId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /recordings/{recordingId}/hide:
    post:
      summary: Ocultar replay
      parameters: [{ $ref: '#/components/parameters/RecordingId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /lives/{liveId}/attendance:
    get:
      summary: Listar presença
      parameters: [{ $ref: '#/components/parameters/liveId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/Paginated' } }
  /lives/{liveId}/questions:
    get:
      summary: Listar perguntas
      parameters: [{ $ref: '#/components/parameters/liveId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/Paginated' } }
  /lives/{liveId}/polls:
    get:
      summary: Listar enquetes
      parameters: [{ $ref: '#/components/parameters/liveId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/Paginated' } }
  /lives/{liveId}/join:
    post:
      summary: Entrar em uma aula (estúdio ou audiência)
      description: |
        Emite o participant token do IVS Real-Time (Web Broadcast SDK / IVS iOS
        Broadcast SDK) e o ticket de conexão do WebSocket. Idempotente — chamar de
        novo para o mesmo usuário reaproveita o `LiveParticipant` já existente
        (não cria um segundo registro).
      parameters:
        - $ref: '#/components/parameters/liveId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinLiveResponse'
              example:
                data:
                  live: { id: 'live-123', status: 'LIVE', title: 'Aula 1' }
                  participant:
                    id: '9c3b...'
                    role: 'ALUNO'
                    capabilities: ['SUBSCRIBE']
                  ivs:
                    stageArn: 'arn:aws:ivs:us-east-1:123456789012:stage/abc'
                    participantToken: 'eyJhbGciOi...'
                    expiresAt: '2026-07-28T15:00:00.000Z'
                  realtime:
                    webSocketUrl: 'wss://example.execute-api.us-east-1.amazonaws.com/production'
                    connectionToken: '6c9e...'
                meta: { requestId: 'a1b2c3' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Live indisponível ou sala ainda sendo preparada (`LIVE_NOT_AVAILABLE`/`STAGE_NOT_PROVISIONED`)
  /lives/{liveId}/token/refresh:
    post:
      summary: Reemitir o participant token do IVS
      description: |
        Chame isto ANTES do `expiresAt` retornado por `/join` (ou pela renovação
        anterior). A validade é a duração agendada da aula + 30min, limitada pelo
        teto do ambiente. No lado do
        cliente, saia do stage atual, crie uma nova instância com o token reemitido
        e entre novamente. Isso interrompe brevemente a publicação. Não use
        `Stage.exchangeToken`: a AWS limita a troca a tokens autoassinados por key
        pair, e estes tokens são criados pela API `CreateParticipantToken`.
      parameters:
        - $ref: '#/components/parameters/liveId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '409':
          description: Usuário ainda não entrou nesta aula (`NOT_JOINED`) ou sala não provisionada (`STAGE_NOT_PROVISIONED`)
  /lives/{liveId}/realtime/ticket:
    post:
      summary: Reemitir o ticket de conexão do WebSocket (reconexão)
      description: |
        Usado na reconexão PREVENTIVA antes do teto de 2h de conexão do API
        Gateway (jitter entre 1h45–1h55 — docs/fase-1-arquitetura.md, seção
        10.9). Nunca chama `CreateParticipantToken` — não afeta a sessão do IVS.
      parameters:
        - $ref: '#/components/parameters/liveId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '409':
          description: Usuário ainda não entrou nesta aula (`NOT_JOINED`)
  /recordings/{recordingId}/playback:
    get:
      summary: Obter URL de reprodução e cookies assinados de uma gravação
      description: |
        Devolve `manifestUrl` (HLS) e os três valores do cookie assinado do
        CloudFront (`policy`/`signature`/`keyPairId`) — um cliente nativo deve
        gravá-los no seu próprio cookie store para o domínio de `manifestUrl`
        (ver docs/ios-integration.md, "Cookies assinados no iOS"). O painel web
        usa uma rota interna equivalente que já seta `Set-Cookie` diretamente.
      parameters:
        - name: recordingId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Gravação existe, mas não está disponível para reprodução (`RECORDING_NOT_AVAILABLE`)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    liveId:
      name: liveId
      in: path
      required: true
      schema: { type: string }
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: string }
    ClassId:
      name: classId
      in: path
      required: true
      schema: { type: string }
    RecordingId:
      name: recordingId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 200 }
  responses:
    Success:
      description: Envelope de sucesso da seção 12.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Paginated:
      description: Coleção paginada por cursor.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedEnvelope' }
    NotFound:
      description: |
        Recurso não encontrado — mesmo código/mensagem tanto para "não existe"
        quanto para "existe em outra instituição" (seção 14 do README, anti-enumeração).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { type: object, required: [requestId], properties: { requestId: { type: string } } }
    PaginatedEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: {} }
            nextCursor: { type: string }
        meta: { type: object, required: [requestId], properties: { requestId: { type: string } } }
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: 'RESOURCE_NOT_FOUND' }
            message: { type: string, example: 'Recurso não encontrado.' }
            details: { type: array, items: {} }
            requestId: { type: string }
    JoinLiveResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            live: { type: object }
            participant:
              type: object
              required: [id, role, capabilities]
              properties:
                id: { type: string }
                role: { type: string, enum: [ADMIN, PROFESSOR, ALUNO] }
                capabilities: { type: array, items: { type: string, enum: [PUBLISH, SUBSCRIBE] } }
            ivs:
              type: object
              properties:
                stageArn: { type: string }
                participantToken: { type: string }
                expiresAt: { type: string, format: date-time }
            realtime:
              type: object
              properties:
                webSocketUrl: { type: string }
                connectionToken: { type: string }
        meta: { type: object, properties: { requestId: { type: string } } }
    RefreshTokenResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            participantToken: { type: string }
            expiresAt: { type: string, format: date-time }
        meta: { type: object, properties: { requestId: { type: string } } }
    TicketResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            connectionToken: { type: string }
            expiresAt: { type: string, format: date-time }
        meta: { type: object, properties: { requestId: { type: string } } }
    PlaybackResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            manifestUrl: { type: string }
            cookiePath: { type: string }
            expiresAt: { type: string, format: date-time }
            cookies:
              type: object
              properties:
                policy: { type: string }
                signature: { type: string }
                keyPairId: { type: string }
        meta: { type: object, properties: { requestId: { type: string } } }
